<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filo Takip</title>
<style>
  :root {
    --bg: #F3F6F8;
    --surface: #FFFFFF;
    --surface-alt: #EAF0F3;
    --border: #DCE5EA;
    --ink: #1C2A33;
    --ink-muted: #647581;
    --accent: #0E6E66;
    --accent-ink: #FFFFFF;
    --danger: #C0392B;
    --danger-bg: #FBEAE7;
    --warn: #B7791F;
    --warn-bg: #FCF1DC;
    --ok: #1E7A46;
    --ok-bg: #E7F5ED;
    --none-bg: #EDEFF1;
    --none-ink: #7A8790;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  #app { display: flex; min-height: 100vh; }
  .loading { margin: auto; color: var(--ink-muted); padding: 40px; }

  .sidebar {
    width: 272px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    gap: 12px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; padding: 2px 6px 10px; border-bottom: 1px solid var(--border); color: var(--accent); }
  .nav-item, .vehicle-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; border-radius: 8px; padding: 9px 10px; cursor: pointer;
    color: var(--ink); font: inherit;
  }
  .nav-item:hover, .vehicle-item:hover { background: var(--surface-alt); }
  .nav-item.active, .vehicle-item.active { background: var(--accent); color: var(--accent-ink); }
  .nav-item.active small, .vehicle-item.active small { color: rgba(255,255,255,0.8) !important; }

  .sidebar-search { display: flex; align-items: center; gap: 8px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--ink-muted); }
  .sidebar-search input { border: none; background: none; outline: none; font: inherit; color: var(--ink); width: 100%; }

  .vehicle-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); padding: 10px 10px 2px; }
  .sidebar-group-label:first-child { padding-top: 2px; }
  .vehicle-item-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .vehicle-item-text strong { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vehicle-item-text small { color: var(--ink-muted); font-size: 12px; }

  .sidebar-footer { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
  .sidebar-footer .btn-ghost, .add-vehicle-btn { justify-content: center; }
  .add-vehicle-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 8px;
    border: 1px dashed var(--border); background: none; color: var(--accent); font: inherit; font-weight: 500; cursor: pointer;
  }
  .add-vehicle-btn:hover { background: var(--surface-alt); }
  .tiny-link { background: none; border: none; color: var(--ink-muted); font-size: 12px; cursor: pointer; text-align: left; padding: 4px 6px; }
  .tiny-link:hover { color: var(--accent); }

  .main { flex: 1; overflow-y: auto; padding: 28px 34px 60px; min-width: 0; }
  .save-error { display: flex; align-items: center; gap: 8px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }

  .main-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .main-header h1 { font-size: 22px; font-weight: 600; margin: 0 0 2px; }
  .muted { color: var(--ink-muted); }
  .small { font-size: 12.5px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .stat-card.warn { border-color: #E8C77A; background: var(--warn-bg); }
  .stat-label { font-size: 12.5px; color: var(--ink-muted); }
  .stat-value { font-size: 21px; font-weight: 600; }

  .panel-columns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-bottom: 18px; align-items: start; }
  .panel-block, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .panel-block h2, .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .card-header h2 { margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  .table { width: 100%; border-collapse: collapse; }
  .table td, .table th { padding: 8px 6px; border-top: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; text-align: left; }
  .table th { color: var(--ink-muted); font-weight: 500; font-size: 12px; border-top: none; }
  .table tr.clickable { cursor: pointer; }
  .table tr.clickable:hover td { background: var(--surface-alt); }
  .table .right { text-align: right; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .dot-overdue { background: var(--danger); }
  .dot-soon { background: var(--warn); }
  .dot-ok { background: var(--ok); }
  .dot-none { background: #B7C0C6; }

  .badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
  .badge-overdue { background: var(--danger-bg); color: var(--danger); }
  .badge-soon { background: var(--warn-bg); color: var(--warn); }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-none { background: var(--none-bg); color: var(--none-ink); }

  .bar-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 10px; }
  .bar-label { font-size: 13px; font-weight: 500; }
  .bar-track { background: var(--surface-alt); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 6px; }
  .bar-value { text-align: right; font-size: 12.5px; color: var(--ink-muted); }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 12.5px; color: var(--ink-muted); }
  .field input, .field select { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--ink); outline: none; width: 100%; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

  .btn-primary, .btn-ghost { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-weight: 500; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { background: none; border-color: var(--border); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface-alt); }
  .btn-ghost.danger { color: var(--danger); border-color: #EAC6C0; }
  .btn-ghost.danger:hover { background: var(--danger-bg); }

  .icon-btn { background: none; border: none; color: var(--ink-muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; font: inherit; font-size: 12.5px; }
  .icon-btn:hover { background: var(--surface-alt); color: var(--danger); }

  .chip { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 500; border: none; border-radius: 20px; padding: 4px 10px; cursor: pointer; }
  .chip-paid { background: var(--ok-bg); color: var(--ok); }
  .chip-unpaid { background: var(--danger-bg); color: var(--danger); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 6px; background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 4px; margin-right: 18px; color: var(--ink-muted); cursor: pointer; font: inherit; font-weight: 500; }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  .dropzone { border: 1.5px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center; color: var(--ink-muted); }
  .dropzone strong { color: var(--accent); }
  .file-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-alt); }
  .file-icon { width: 32px; height: 32px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
  .file-meta { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .file-meta strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta small { color: var(--ink-muted); }

  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
  .report-card h3 { margin: 0 0 4px; font-size: 15.5px; }
  .report-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
  .report-metric { background: var(--surface-alt); border-radius: 8px; padding: 10px 12px; }
  .report-metric span { display: block; }
  .report-metric .n { font-size: 15px; font-weight: 600; }
  .report-metric .l { font-size: 11.5px; color: var(--ink-muted); }

  .company-section { margin-bottom: 34px; padding-top: 18px; border-top: 2px solid var(--border); }
  .company-section:first-of-type { padding-top: 0; border-top: none; }
  .company-section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .company-section-header h2 { font-size: 18px; font-weight: 700; margin: 0; color: var(--accent); }

  @media print {
    .sidebar, .no-print { display: none !important; }
    .main { padding: 0; }
    body { background: white; }
  }

  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar { position: static; height: auto; width: 100%; }
    .panel-columns { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .report-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Kayıtlar yükleniyor…</div></div>

<script>
"use strict";

// ---------- yardımcılar ----------

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);

function esc(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((d - now) / 86400000);
}
function statusOf(dateStr) {
  const days = daysUntil(dateStr);
  if (days === null) return "none";
  if (days < 0) return "overdue";
  if (days <= 30) return "soon";
  return "ok";
}
const STATUS_LABEL = { overdue: "Süresi geçti", soon: "Yaklaşıyor", ok: "Güncel", none: "Tarih girilmemiş" };

function fmtDate(dateStr) {
  if (!dateStr) return "—";
  return new Date(dateStr + "T00:00:00").toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
}
function fmtMoney(n) {
  return (Number(n) || 0).toLocaleString("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 });
}
function fmtKm(n) {
  if (n === null || n === undefined || n === "") return "—";
  return Number(n).toLocaleString("tr-TR") + " km";
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function vehicleWorstStatus(v) {
  const statuses = [statusOf(v.inspectionDate), statusOf(v.insurance?.date), statusOf(v.kasko?.date)];
  if (statuses.includes("overdue")) return "overdue";
  if (statuses.includes("soon")) return "soon";
  if (statuses.every((s) => s === "none")) return "none";
  return "ok";
}

function latestKm(v) {
  const candidates = [Number(v.currentKm) || null, ...(v.fuel || []).map((f) => Number(f.km) || null), ...(v.kmLog || []).map((k) => Number(k.km) || null)].filter((x) => x);
  return candidates.length ? Math.max(...candidates) : null;
}

const DEFAULT_COMPANIES = ["Full Supplement", "Detay Online"];

function emptyVehicle() {
  return {
    id: uid(), company: "", plate: "", brand: "", model: "", year: "", driver: "", currentKm: "",
    inspectionDate: "",
    insurance: { date: "", cost: "" },
    kasko: { date: "", cost: "" },
    maintenance: [], fines: [], fuel: [], hgs: [], kmLog: [],
  };
}

function allCompanies() {
  const fromVehicles = state.vehicles.map((v) => (v.company || "").trim()).filter(Boolean);
  return Array.from(new Set([...DEFAULT_COMPANIES, ...fromVehicles]));
}

function companyDatalistHTML() {
  return `<datalist id="company-list">${allCompanies().map((c) => `<option value="${esc(c)}">`).join("")}</datalist>`;
}

function groupByCompany(vehicles, opts) {
  opts = opts || {};
  const groups = {};
  vehicles.forEach((v) => {
    const key = (v.company || "").trim() || "__none__";
    (groups[key] = groups[key] || []).push(v);
  });
  const extra = Object.keys(groups).filter((k) => k !== "__none__" && !DEFAULT_COMPANIES.includes(k));
  const order = [...DEFAULT_COMPANIES, ...extra];
  let result = order.map((k) => ({ company: k, vehicles: groups[k] || [] }));
  if (!opts.includeEmpty) result = result.filter((g) => g.vehicles.length > 0);
  if (groups.__none__) result.push({ company: "__none__", vehicles: groups.__none__ });
  return result;
}

// ---------- IndexedDB ----------

const dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open("filoTakipDB", 1);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains("vehicles")) db.createObjectStore("vehicles", { keyPath: "id" });
    if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

async function idbGetAll(store) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, "readonly").objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(store, value) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(store, id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(store, id) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, "readonly").objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbClear(store) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ---------- durum ----------

let state = {
  vehicles: [],
  filesMeta: [], // {id, vehicleId, name, type, size, uploadedAt}
  loaded: false,
  view: "dashboard", // 'dashboard' | 'report' | vehicleId
  tab: "genel",
  search: "",
  addingVehicle: false,
  newVehicle: emptyVehicle(),
  saveError: false,
};

async function loadAll() {
  const vehicles = await idbGetAll("vehicles");
  const files = await idbGetAll("files");
  state.vehicles = vehicles;
  state.filesMeta = files.map((f) => ({ id: f.id, vehicleId: f.vehicleId, name: f.name, type: f.type, size: f.size, uploadedAt: f.uploadedAt }));
  state.loaded = true;
}

async function saveVehicle(v) {
  try {
    await idbPut("vehicles", v);
    state.vehicles = state.vehicles.map((x) => (x.id === v.id ? v : x));
    state.saveError = false;
  } catch (e) {
    state.saveError = true;
  }
  render();
}

function getVehicle(id) {
  return state.vehicles.find((v) => v.id === id);
}

// ---------- render kökü ----------

function navigate(patch) {
  Object.assign(state, patch);
  history.pushState({ view: state.view, tab: state.tab, addingVehicle: state.addingVehicle }, "");
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML = '<div class="loading">Kayıtlar yükleniyor…</div>'; return; }
  app.innerHTML = `<div class="app-shell" style="display:flex;width:100%;">${sidebarHTML()}<main class="main">${mainHTML()}</main></div>`;
  bindEvents();
}

function sidebarHTML() {
  const q = state.search.trim().toLocaleLowerCase("tr-TR");
  const filtered = !q ? state.vehicles : state.vehicles.filter((v) => [v.plate, v.brand, v.model, v.driver].join(" ").toLocaleLowerCase("tr-TR").includes(q));
  const groups = groupByCompany(filtered);
  return `
    <aside class="sidebar">
      <div class="brand">🚐 Filo Takip</div>
      <button class="nav-item ${state.view === "dashboard" ? "active" : ""}" data-nav="dashboard">📊 Panel</button>
      <button class="nav-item ${state.view === "report" ? "active" : ""}" data-nav="report">🗓️ Haftalık Rapor</button>
      <div class="sidebar-search">🔎 <input id="search-input" placeholder="Plaka, marka, sürücü ara" value="${esc(state.search)}"></div>
      <div class="vehicle-list">
        ${state.vehicles.length === 0 ? '<p class="muted small">Henüz araç eklenmedi.</p>' : ""}
        ${filtered.length === 0 && state.vehicles.length > 0 ? '<p class="muted small">Eşleşen araç yok.</p>' : ""}
        ${groups.map((g) => `
          <div class="sidebar-group-label">${g.company === "__none__" ? "Şirket atanmamış" : esc(g.company)} <span class="muted">(${g.vehicles.length})</span></div>
          ${g.vehicles.map((v) => `
          <button class="vehicle-item ${state.view === v.id ? "active" : ""}" data-nav="${v.id}">
            <span class="dot dot-${vehicleWorstStatus(v)}"></span>
            <span class="vehicle-item-text"><strong>${esc(v.plate) || "Plaka yok"}</strong><small>${esc([v.brand, v.model].filter(Boolean).join(" ")) || "—"}</small></span>
          </button>`).join("")}`).join("")}
      </div>
      ${companyDatalistHTML()}
      <button class="add-vehicle-btn" data-action="add-vehicle-open">＋ Araç ekle</button>
      <div class="sidebar-footer">
        <button class="tiny-link" data-action="export-csv">📗 Excel raporu indir (.csv)</button>
        <button class="tiny-link" data-action="export">⬇ Yedek indir (.json)</button>
        <button class="tiny-link" data-action="import-open">⬆ Yedekten geri yükle</button>
        <input type="file" id="import-input" accept="application/json" style="display:none">
      </div>
    </aside>`;
}

function mainHTML() {
  let body = "";
  if (state.addingVehicle) body = newVehicleFormHTML();
  else if (state.view === "dashboard") body = dashboardHTML();
  else if (state.view === "report") body = reportHTML();
  else {
    const v = getVehicle(state.view);
    body = v ? vehicleDetailHTML(v) : dashboardHTML();
  }
  return (state.saveError ? '<div class="save-error">⚠ Kayıt sırasında bir sorun oluştu, son değişiklik kaydedilmemiş olabilir.</div>' : "") + body;
}

// ---------- panel ----------

function computeStats(vehicles) {
  const upcoming = [];
  vehicles.forEach((v) => {
    const push = (label, date) => { if (date) upcoming.push({ plate: v.plate, id: v.id, label, date, days: daysUntil(date), status: statusOf(date) }); };
    push("Muayene", v.inspectionDate);
    push("Sigorta", v.insurance?.date);
    push("Kasko", v.kasko?.date);
  });
  const upcomingFiltered = upcoming.filter((u) => u.status === "overdue" || u.status === "soon").sort((a, b) => a.days - b.days);

  const unpaidFines = [];
  vehicles.forEach((v) => (v.fines || []).forEach((f) => !f.paid && unpaidFines.push({ ...f, plate: v.plate, vehicleId: v.id })));
  unpaidFines.sort((a, b) => new Date(b.date) - new Date(a.date));

  let policy = 0, maintenance = 0, fuel = 0, hgs = 0, finesPaid = 0, finesUnpaid = 0;
  vehicles.forEach((v) => {
    policy += (Number(v.insurance?.cost) || 0) + (Number(v.kasko?.cost) || 0);
    (v.maintenance || []).forEach((m) => (maintenance += Number(m.cost) || 0));
    (v.fuel || []).forEach((f) => (fuel += Number(f.cost) || 0));
    (v.hgs || []).forEach((h) => (hgs += Number(h.amount) || 0));
    (v.fines || []).forEach((f) => (f.paid ? (finesPaid += Number(f.amount) || 0) : (finesUnpaid += Number(f.amount) || 0)));
  });

  const costliest = vehicles.map((v) => {
    const sum = (Number(v.insurance?.cost) || 0) + (Number(v.kasko?.cost) || 0)
      + (v.maintenance || []).reduce((s, m) => s + (Number(m.cost) || 0), 0)
      + (v.fuel || []).reduce((s, f) => s + (Number(f.cost) || 0), 0)
      + (v.hgs || []).reduce((s, h) => s + (Number(h.amount) || 0), 0)
      + (v.fines || []).reduce((s, f) => s + (Number(f.amount) || 0), 0);
    return { plate: v.plate || "—", sum };
  }).filter((v) => v.sum > 0).sort((a, b) => b.sum - a.sum).slice(0, 6);
  const maxCost = Math.max(1, ...costliest.map((c) => c.sum));

  return { upcomingFiltered, unpaidFines, policy, maintenance, fuel, hgs, finesPaid, finesUnpaid, costliest, maxCost };
}

// ---------- haftalık rapor ----------

function reportHTML() {
  const cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setDate(cutoff.getDate() - 7);

  const inRange = (dateStr) => dateStr && new Date(dateStr + "T00:00:00") >= cutoff;

  const rows = state.vehicles.map((v) => {
    const fuel = (v.fuel || []).filter((f) => inRange(f.date));
    const hgs = (v.hgs || []).filter((h) => inRange(h.date));
    const maint = (v.maintenance || []).filter((m) => inRange(m.date));
    const fines = (v.fines || []).filter((f) => inRange(f.date));
    const fuelCost = fuel.reduce((s, f) => s + (Number(f.cost) || 0), 0);
    const hgsCost = hgs.reduce((s, h) => s + (Number(h.amount) || 0), 0);
    const maintCost = maint.reduce((s, m) => s + (Number(m.cost) || 0), 0);
    const finesCost = fines.reduce((s, f) => s + (Number(f.amount) || 0), 0);

    const kmEntries = [...(v.fuel || []).map((f) => ({ date: f.date, km: Number(f.km) || null })), ...(v.kmLog || []).map((k) => ({ date: k.date, km: Number(k.km) || null }))]
      .filter((e) => e.km).sort((a, b) => new Date(a.date) - new Date(b.date));
    const before = [...kmEntries].filter((e) => new Date(e.date + "T00:00:00") < cutoff).pop();
    const latest = kmEntries[kmEntries.length - 1];
    let kmDelta = null;
    if (before && latest && latest.km >= before.km) kmDelta = latest.km - before.km;

    const total = fuelCost + hgsCost + maintCost + finesCost;
    return { v, fuel, hgs, maint, fines, fuelCost, hgsCost, maintCost, finesCost, kmDelta, total, hasActivity: fuel.length || hgs.length || maint.length || fines.length || kmDelta !== null };
  });

  return `
    <header class="main-header">
      <div><button class="btn-ghost no-print" data-action="go-back" style="margin-bottom:8px;">← Geri</button><h1>Haftalık Rapor</h1><p class="muted">${fmtDate(cutoff.toISOString().slice(0,10))} – ${fmtDate(todayISO())} arası, plaka plaka</p></div>
      <button class="btn-ghost no-print" data-action="print">🖨 Yazdır / PDF olarak kaydet</button>
    </header>
    ${state.vehicles.length === 0 ? '<p class="muted">Rapor için önce araç eklemelisin.</p>' : ""}
    ${rows.map(({ v, fuel, hgs, maint, fines, fuelCost, hgsCost, maintCost, finesCost, kmDelta, total, hasActivity }) => `
      <div class="report-card">
        <h3>${esc(v.plate) || "Plaka yok"} <span class="muted small">— ${esc([v.brand, v.model].filter(Boolean).join(" ")) || "—"}</span></h3>
        ${!hasActivity ? '<p class="muted small">Bu hafta yeni kayıt girilmedi.</p>' : `
        <div class="report-grid">
          <div class="report-metric"><span class="n">${fmtKm(kmDelta)}</span><span class="l">Km değişimi</span></div>
          <div class="report-metric"><span class="n">${fuel.length}</span><span class="l">Yakıt alımı · ${fmtMoney(fuelCost)}</span></div>
          <div class="report-metric"><span class="n">${hgs.length}</span><span class="l">HGS kaydı · ${fmtMoney(hgsCost)}</span></div>
          <div class="report-metric"><span class="n">${maint.length}</span><span class="l">Bakım · ${fmtMoney(maintCost)}</span></div>
          <div class="report-metric"><span class="n">${fines.length}</span><span class="l">Ceza · ${fmtMoney(finesCost)}</span></div>
        </div>
        <p class="muted small" style="margin-top:10px;">Haftalık toplam gider: <strong style="color:var(--ink);">${fmtMoney(total)}</strong></p>`}
      </div>`).join("")}
    <p class="muted small">Not: Bu rapor her açıldığında son 7 güne göre yeniden hesaplanır. Otomatik e-posta gönderimi bu bağımsız dosyada desteklenmiyor; "Yazdır" ile PDF olarak kaydedip paylaşabilirsin.</p>`;
}

        </tbody></table>`}
      </div>
    </div>`;
}

function cezaTab(v) {
  const sorted = [...(v.fines || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
  const unpaidTotal = (v.fines || []).filter((f) => !f.paid).reduce((s, f) => s + (Number(f.amount) || 0), 0);
  return `
    <div class="stack">
      <form class="card" id="form-add-fine" data-id="${v.id}">
        <h2>Ceza kaydı ekle</h2>
        <div class="form-grid">
          <label class="field"><span class="field-label">Tarih</span><input type="date" name="date" value="${todayISO()}"></label>
          <label class="field"><span class="field-label">Sebep</span><input name="reason" placeholder="Hız ihlali, park, vb."></label>
          <label class="field"><span class="field-label">Tutar</span><input type="number" min="0" name="amount" placeholder="0"></label>
          <label class="field"><span class="field-label">Sürücü</span><input name="driver" value="${esc(v.driver)}"></label>
        </div>
        <div class="form-actions"><button type="submit" class="btn-primary">＋ Ekle</button></div>
      </form>
      <div class="card">
        <div class="card-header"><h2>Ceza geçmişi</h2><span class="muted small">Bekleyen: ${fmtMoney(unpaidTotal)}</span></div>
        ${sorted.length === 0 ? '<p class="muted">Henüz ceza kaydı yok.</p>' : `
        <table class="table"><tbody>
          ${sorted.map((f) => `<tr><td>${fmtDate(f.date)}</td><td>${esc(f.reason)}</td><td>${esc(f.driver) || "—"}</td><td class="right">${fmtMoney(f.amount)}</td>
            <td><button class="chip ${f.paid ? "chip-paid" : "chip-unpaid"}" data-action="toggle-fine" data-id="${v.id}" data-item="${f.id}">${f.paid ? "✓ Ödendi" : "Ödenmedi"}</button></td>
            <td class="right"><button class="icon-btn" data-action="delete-item" data-id="${v.id}" data-list="fines" data-item="${f.id}">Sil</button></td></tr>`).join("")}
        </tbody></table>`}
      </div>
    </div>`;
}

function belgeTab(v) {
  const files = state.filesMeta.filter((f) => f.vehicleId === v.id).sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
  return `
    <div class="stack">
      <div class="card">
        <h2>Belge yükle</h2>
        <p class="muted small">Ruhsat, sigorta poliçesi, muayene belgesi gibi dosyaları (PDF, resim) buradan yükleyebilirsin.</p>
        <label class="dropzone" for="file-input-${v.id}" style="display:block;cursor:pointer;">
          📎 Dosya seçmek için tıkla <br><span class="small">PDF, JPG, PNG desteklenir</span>
        </label>
        <input type="file" id="file-input-${v.id}" data-vehicle="${v.id}" multiple style="display:none">
      </div>
      <div class="card">
        <h2>Yüklenen belgeler</h2>
        ${files.length === 0 ? '<p class="muted">Henüz belge yüklenmedi.</p>' : `
        <div class="file-list">
          ${files.map((f) => `
            <div class="file-row">
              <div class="file-icon">${(f.type.split("/")[1] || f.name.split(".").pop() || "?").slice(0, 3).toUpperCase()}</div>
              <div class="file-meta"><strong>${esc(f.name)}</strong><small>${fmtSize(f.size)} · ${fmtDate(f.uploadedAt)}</small></div>
              <button class="icon-btn" data-action="open-file" data-item="${f.id}">Aç</button>
              <button class="icon-btn" data-action="delete-file" data-item="${f.id}" data-vehicle="${v.id}">Sil</button>
            </div>`).join("")}
        </div>`}
      </div>
    </div>`;
}

// ---------- olay bağlama ----------

function bindEvents() {
  document.querySelectorAll("[data-nav]").forEach((el) => el.addEventListener("click", () => {
    navigate({ view: el.getAttribute("data-nav"), tab: "genel", addingVehicle: false });
  }));
  document.querySelectorAll("[data-tab]").forEach((el) => el.addEventListener("click", () => { navigate({ tab: el.getAttribute("data-tab") }); }));
  document.querySelectorAll("[data-tab-link]").forEach((el) => el.addEventListener("click", () => { navigate({ tab: el.getAttribute("data-tab-link") }); }));
  document.querySelectorAll('[data-action="go-back"]').forEach((el) => el.addEventListener("click", () => { history.back(); }));

  const searchInput = document.getElementById("search-input");
  if (searchInput) searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); });

  const addBtn = document.querySelector('[data-action="add-vehicle-open"]');
  if (addBtn) addBtn.addEventListener("click", () => { state.newVehicle = emptyVehicle(); navigate({ addingVehicle: true }); });
  const cancelBtns = document.querySelectorAll('[data-action="add-vehicle-cancel"]');
  cancelBtns.forEach((b) => b.addEventListener("click", () => { navigate({ addingVehicle: false }); }));

  const newVForm = document.getElementById("form-new-vehicle");
  if (newVForm) newVForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(newVForm);
    if (!fd.get("plate").trim()) return;
    const v = { ...emptyVehicle(), company: fd.get("company"), plate: fd.get("plate"), brand: fd.get("brand"), model: fd.get("model"), year: fd.get("year"), driver: fd.get("driver"), currentKm: fd.get("currentKm") };
    await idbPut("vehicles", v);
    state.vehicles.push(v);
    navigate({ addingVehicle: false, view: v.id, tab: "genel" });
  });

  document.querySelectorAll('[data-action="delete-vehicle"]').forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Bu araç ve tüm kayıtları silinsin mi?")) return;
    const id = b.getAttribute("data-id");
    await idbDelete("vehicles", id);
    const filesToDelete = state.filesMeta.filter((f) => f.vehicleId === id);
    for (const f of filesToDelete) await idbDelete("files", f.id);
    state.vehicles = state.vehicles.filter((v) => v.id !== id);
    state.filesMeta = state.filesMeta.filter((f) => f.vehicleId !== id);
    navigate({ view: "dashboard", tab: "genel" });
  }));

  // genel form
  const genelForm = document.getElementById("form-genel");
  if (genelForm) genelForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(genelForm);
    const v = getVehicle(genelForm.getAttribute("data-id"));
    saveVehicle({ ...v, company: fd.get("company"), plate: fd.get("plate"), brand: fd.get("brand"), model: fd.get("model"), year: fd.get("year"), driver: fd.get("driver"), currentKm: fd.get("currentKm") });
  });
  const inspForm = document.getElementById("form-inspection");
  if (inspForm) inspForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = getVehicle(inspForm.getAttribute("data-id"));
    saveVehicle({ ...v, inspectionDate: new FormData(inspForm).get("inspectionDate") });
  });
  const insForm = document.getElementById("form-insurance");
  if (insForm) insForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(insForm);
    const v = getVehicle(insForm.getAttribute("data-id"));
    saveVehicle({ ...v, insurance: { date: fd.get("date"), cost: fd.get("cost") } });
  });
  const kaskoForm = document.getElementById("form-kasko");
  if (kaskoForm) kaskoForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(kaskoForm);
    const v = getVehicle(kaskoForm.getAttribute("data-id"));
    saveVehicle({ ...v, kasko: { date: fd.get("date"), cost: fd.get("cost") } });
  });

  bindListForm("form-add-fuel", "fuel", (fd) => ({ date: fd.get("date"), liters: fd.get("liters"), cost: fd.get("cost"), km: fd.get("km"), station: fd.get("station") }));
  bindListForm("form-add-hgs", "hgs", (fd) => ({ date: fd.get("date"), type: fd.get("type"), amount: fd.get("amount"), note: fd.get("note") }));
  bindListForm("form-add-km", "kmLog", (fd) => ({ date: fd.get("date"), km: fd.get("km"), note: fd.get("note") }));
  bindListForm("form-add-maint", "maintenance", (fd) => ({ date: fd.get("date"), description: fd.get("description"), km: fd.get("km"), cost: fd.get("cost") }));
  bindListForm("form-add-fine", "fines", (fd) => ({ date: fd.get("date"), reason: fd.get("reason"), amount: fd.get("amount"), driver: fd.get("driver"), paid: false }));

  document.querySelectorAll('[data-action="delete-item"]').forEach((b) => b.addEventListener("click", () => {
    const v = getVehicle(b.getAttribute("data-id"));
    const list = b.getAttribute("data-list");
    const itemId = b.getAttribute("data-item");
    saveVehicle({ ...v, [list]: v[list].filter((x) => x.id !== itemId) });
  }));

  document.querySelectorAll('[data-action="toggle-fine"]').forEach((b) => b.addEventListener("click", () => {
    const v = getVehicle(b.getAttribute("data-id"));
    const itemId = b.getAttribute("data-item");
    saveVehicle({ ...v, fines: v.fines.map((f) => (f.id === itemId ? { ...f, paid: !f.paid } : f)) });
  }));

  // belgeler
  document.querySelectorAll('input[type="file"][data-vehicle]').forEach((input) => input.addEventListener("change", async (e) => {
    const vehicleId = input.getAttribute("data-vehicle");
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      const record = { id: uid(), vehicleId, name: file.name, type: file.type || "application/octet-stream", size: file.size, uploadedAt: todayISO(), blob: file };
      await idbPut("files", record);
      state.filesMeta.push({ id: record.id, vehicleId, name: record.name, type: record.type, size: record.size, uploadedAt: record.uploadedAt });
    }
    render();
  }));
  document.querySelectorAll('[data-action="open-file"]').forEach((b) => b.addEventListener("click", async () => {
    const rec = await idbGet("files", b.getAttribute("data-item"));
    if (!rec) return;
    const url = URL.createObjectURL(rec.blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }));
  document.querySelectorAll('[data-action="delete-file"]').forEach((b) => b.addEventListener("click", async () => {
    const itemId = b.getAttribute("data-item");
    await idbDelete("files", itemId);
    state.filesMeta = state.filesMeta.filter((f) => f.id !== itemId);
    render();
  }));

  // rapor yazdırma
  const printBtn = document.querySelector('[data-action="print"]');
  if (printBtn) printBtn.addEventListener("click", () => window.print());

  // yedekleme
  const exportCsvBtn = document.querySelector('[data-action="export-csv"]');
  if (exportCsvBtn) exportCsvBtn.addEventListener("click", exportCsvReport);
  const exportBtn = document.querySelector('[data-action="export"]');
  if (exportBtn) exportBtn.addEventListener("click", exportData);
  const importOpenBtn = document.querySelector('[data-action="import-open"]');
  const importInput = document.getElementById("import-input");
  if (importOpenBtn && importInput) {
    importOpenBtn.addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (file) await importData(file);
      importInput.value = "";
    });
  }
}

function bindListForm(formId, listKey, mapFn) {
  const form = document.getElementById(formId);
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const v = getVehicle(form.getAttribute("data-id"));
    const entry = { id: uid(), ...mapFn(fd) };
    saveVehicle({ ...v, [listKey]: [...(v[listKey] || []), entry] });
  });
}

// ---------- Excel (CSV) raporu ----------

function csvCell(v) {
  const s = String(v ?? "");
  if (/[;"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvRow(fields) { return fields.map(csvCell).join(";"); }

function exportCsvReport() {
  const lines = [];

  lines.push("ARAÇLAR");
  lines.push(csvRow(["Şirket", "Plaka", "Marka", "Model", "Yıl", "Sürücü", "Güncel Km", "Muayene Tarihi", "Sigorta Bitiş", "Sigorta Tutar", "Kasko Bitiş", "Kasko Tutar"]));
  state.vehicles.forEach((v) => {
    lines.push(csvRow([v.company || "—", v.plate, v.brand, v.model, v.year, v.driver, latestKm(v) ?? "", fmtDate(v.inspectionDate), fmtDate(v.insurance?.date), v.insurance?.cost || "", fmtDate(v.kasko?.date), v.kasko?.cost || ""]));
  });
  lines.push("");

  lines.push("YAKIT KAYITLARI");
  lines.push(csvRow(["Plaka", "Tarih", "Litre", "Tutar", "Km", "İstasyon"]));
  state.vehicles.forEach((v) => (v.fuel || []).forEach((f) => lines.push(csvRow([v.plate, fmtDate(f.date), f.liters || "", f.cost || "", f.km || "", f.station || ""]))));
  lines.push("");

  lines.push("HGS KAYITLARI");
  lines.push(csvRow(["Plaka", "Tarih", "Tür", "Tutar", "Not"]));
  state.vehicles.forEach((v) => (v.hgs || []).forEach((h) => lines.push(csvRow([v.plate, fmtDate(h.date), h.type === "yukleme" ? "Bakiye yükleme" : "Geçiş / kesinti", h.amount || "", h.note || ""]))));
  lines.push("");

  lines.push("KM KAYITLARI");
  lines.push(csvRow(["Plaka", "Tarih", "Km", "Not"]));
  state.vehicles.forEach((v) => (v.kmLog || []).forEach((k) => lines.push(csvRow([v.plate, fmtDate(k.date), k.km || "", k.note || ""]))));
  lines.push("");

  lines.push("BAKIM KAYITLARI");
  lines.push(csvRow(["Plaka", "Tarih", "Açıklama", "Km", "Tutar"]));
  state.vehicles.forEach((v) => (v.maintenance || []).forEach((m) => lines.push(csvRow([v.plate, fmtDate(m.date), m.description || "", m.km || "", m.cost || ""]))));
  lines.push("");

  lines.push("CEZA KAYITLARI");
  lines.push(csvRow(["Plaka", "Tarih", "Sebep", "Tutar", "Sürücü", "Durum"]));
  state.vehicles.forEach((v) => (v.fines || []).forEach((f) => lines.push(csvRow([v.plate, fmtDate(f.date), f.reason || "", f.amount || "", f.driver || "", f.paid ? "Ödendi" : "Ödenmedi"]))));

  const csvContent = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `filo-takip-rapor-${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- yedekleme / geri yükleme ----------

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataURL) {
  const [header, base64] = dataURL.split(",");
  const mime = (header.match(/:(.*?);/) || [, ""])[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function exportData() {
  const vehicles = await idbGetAll("vehicles");
  const files = await idbGetAll("files");
  const filesExport = await Promise.all(files.map(async (f) => ({ id: f.id, vehicleId: f.vehicleId, name: f.name, type: f.type, size: f.size, uploadedAt: f.uploadedAt, dataUrl: await blobToBase64(f.blob) })));
  const payload = { version: 1, exportedAt: new Date().toISOString(), vehicles, files: filesExport };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `filo-takip-yedek-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importData(file) {
  const text = await file.text();
  let payload;
  try { payload = JSON.parse(text); } catch (e) { alert("Dosya okunamadı, geçerli bir yedek dosyası seçtiğinden emin ol."); return; }
  if (!confirm("Mevcut tüm veriler yedekteki verilerle değiştirilecek. Devam edilsin mi?")) return;
  await idbClear("vehicles");
  await idbClear("files");
  for (const v of payload.vehicles || []) await idbPut("vehicles", v);
  for (const f of payload.files || []) {
    const blob = dataURLToBlob(f.dataUrl);
    await idbPut("files", { id: f.id, vehicleId: f.vehicleId, name: f.name, type: f.type, size: f.size, uploadedAt: f.uploadedAt, blob });
  }
  await loadAll();
  state.view = "dashboard";
  render();
}

// ---------- başlat ----------

window.addEventListener("popstate", (e) => {
  const s = e.state || { view: "dashboard", tab: "genel", addingVehicle: false };
  state.view = s.view || "dashboard";
  state.tab = s.tab || "genel";
  state.addingVehicle = !!s.addingVehicle;
  render();
});

loadAll().then(() => {
  history.replaceState({ view: state.view, tab: state.tab, addingVehicle: state.addingVehicle }, "");
  render();
});
</script>
